services:
  postfix:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      TLS_CERT_PATH: /etc/letsencrypt/live/${SMTP_HOSTNAME}/fullchain.pem
      TLS_KEY_PATH: /etc/letsencrypt/live/${SMTP_HOSTNAME}/privkey.pem
    # Do not use Docker's embedded 127.0.0.11 resolver for the Microsoft
    # upstream. It can return transient NXDOMAIN/SERVFAIL while the host DNS
    # succeeds, causing Postfix to defer mail with dsn=4.4.3.
    dns:
      - ${DNS_SERVER_1:-1.1.1.1}
      - ${DNS_SERVER_2:-8.8.8.8}
    ports:
      - "${SMTP_LISTEN_ADDR:-0.0.0.0}:587:587/tcp"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - postfix-queue:/var/spool/postfix
      - postfix-sasl:/var/lib/sasl2
      - ./data/relay-policy:/etc/postfix/relay-policy
      - postfix-logs:/var/log/postfix
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1 && test -s /var/log/postfix/mail.log"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_LISTEN_ADDR:-0.0.0.0}:80:80/tcp"
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  certbot-renew:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./docker/certbot/renew-if-needed.sh:/usr/local/bin/renew-if-needed:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        while :; do
          if ! /bin/sh /usr/local/bin/renew-if-needed; then
            echo "Certificate validation/renewal failed; will retry in 24 hours." >&2
          fi
          sleep 24h
        done

  certbot-init:
    image: certbot/certbot:v3.1.0
    profiles: ["bootstrap"]
    env_file: .env
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        test -n "$$LETSENCRYPT_EMAIL"
        test -n "$$SMTP_HOSTNAME"
        certbot certonly --webroot -w /var/www/certbot \
          --email "$$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email \
          --keep-until-expiring -d "$$SMTP_HOSTNAME"

volumes:
  letsencrypt:
  certbot-webroot:
  postfix-queue:
  postfix-sasl:

  postfix-logs:
